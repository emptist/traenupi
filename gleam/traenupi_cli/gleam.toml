name = "traenupi_cli"
version = "1.0.0"
target = "javascript"

description = "TraeNuPI CLI Application - Command-line interface for TraeNuPI"
licences = ["MIT"]
repository = { type = "github", user = "nezha", repo = "traenupi" }

[javascript]
typescript_declarations = true
runtime = "nodejs"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
node_pg = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
traenupi_core = { path = "../traenupi_core" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
